services:
  temporal-db-init:
    image: postgres:16-alpine
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-autoflow}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until pg_isready -h postgres -U ${POSTGRES_USER:-autoflow} -d ${POSTGRES_DB:-autoflow}; do sleep 2; done
        psql -h postgres -U ${POSTGRES_USER:-autoflow} -d ${POSTGRES_DB:-autoflow} -v ON_ERROR_STOP=1 -c "SELECT 'CREATE DATABASE temporal' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'temporal')\\gexec"
        psql -h postgres -U ${POSTGRES_USER:-autoflow} -d ${POSTGRES_DB:-autoflow} -v ON_ERROR_STOP=1 -c "SELECT 'CREATE DATABASE temporal_visibility' WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'temporal_visibility')\\gexec"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  temporal:
    image: temporalio/auto-setup:1.27.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-autoflow}
      POSTGRES_PWD: ${POSTGRES_PASSWORD:-autoflow}
      POSTGRES_SEEDS: postgres
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      NUM_HISTORY_SHARDS: 4
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    ports:
      - "7233:7233"
    depends_on:
      temporal-db-init:
        condition: service_completed_successfully
    restart: unless-stopped

  temporal-ui:
    image: temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:8088
    ports:
      - "8088:8080"
    depends_on:
      temporal:
        condition: service_started
    restart: unless-stopped
