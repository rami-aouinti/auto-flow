[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/offer-workers-supervisord.pid
childlogdir=/tmp

[program:offer-expiration]
command=php /app/bin/expire-offers.php
directory=/app
user=www-data
autostart=true
autorestart=unexpected
startsecs=2
startretries=10
stopsignal=TERM
stopwaitsecs=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:offer-outbox-publisher]
command=php /app/bin/outbox-publisher.php
directory=/app
user=www-data
autostart=true
autorestart=unexpected
startsecs=2
startretries=10
stopsignal=TERM
stopwaitsecs=40
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
