# Production-only Compose overrides.
# Keep private key material outside the repository and provide
# DOCUSIGN_PRIVATE_KEY_HOST_PATH in the deployment environment.
services:
  contract-service:
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${CONTRACT_APP_SECRET:?Set CONTRACT_APP_SECRET}
      CONTRACT_DATABASE_URL: ${CONTRACT_DATABASE_URL:?Set CONTRACT_DATABASE_URL}
      DOCUSIGN_PRIVATE_KEY_PATH: /run/secrets/docusign_rsa_private_key
    secrets:
      - docusign_rsa_private_key

  billing-service:
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${BILLING_APP_SECRET:?Set BILLING_APP_SECRET}
      BILLING_DATABASE_URL: ${BILLING_DATABASE_URL:?Set BILLING_DATABASE_URL}

secrets:
  docusign_rsa_private_key:
    file: ${DOCUSIGN_PRIVATE_KEY_HOST_PATH:?Set DOCUSIGN_PRIVATE_KEY_HOST_PATH to the mounted DocuSign RSA private-key file}
