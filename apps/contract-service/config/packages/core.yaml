core:
    correlation_id: true
    authentication:
        enabled: true
        issuer: '%env(resolve:AUTOFLOW_JWT_ISSUER)%'
        audience: 'autoflow-contract'
        jwks_uri: '%env(resolve:AUTOFLOW_JWT_JWKS_URI)%'
        jwks_cache_ttl: 300
        protected_path_prefixes: ['/api/']
        tenant_required_path_prefixes: ['/api/v1/contracts']
        excluded_paths: ['/api/v1/contracts/webhooks/docusign']
