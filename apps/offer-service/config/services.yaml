parameters:
    app.pricing_service_url: '%env(resolve:PRICING_SERVICE_URL)%'
    app.keycloak_token_url: '%env(resolve:KEYCLOAK_TOKEN_URL)%'
    app.pricing_client_id: '%env(PRICING_CLIENT_ID)%'
    app.pricing_client_secret: '%env(PRICING_CLIENT_SECRET)%'
    app.pricing_audience: 'autoflow-pricing'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Controller\OfferController:
        arguments:
            $pricingServiceUrl: '%app.pricing_service_url%'

    App\Security\KeycloakClientCredentialsTokenProvider:
        arguments:
            $tokenUrl: '%app.keycloak_token_url%'
            $clientId: '%app.pricing_client_id%'
            $clientSecret: '%app.pricing_client_secret%'
            $pricingAudience: '%app.pricing_audience%'
