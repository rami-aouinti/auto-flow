version: "3"

server:
  command: "php bin/http-worker.php"
  relay: "pipes"
  relay_timeout: 20s

http:
  address: "0.0.0.0:8080"
  max_request_size: 16
  middleware: ["gzip"]
  pool:
    # Keep two HTTP workers so a slow request cannot starve readiness probes.
    num_workers: 2
    # Recycle workers periodically to bound long-running PHP process state.
    max_jobs: 250
    allocate_timeout: 60s
    destroy_timeout: 60s

grpc:
  listen: "tcp://0.0.0.0:9001"
  proto:
    - "../packages/core-bundle/proto/core/v1/health.proto"
  pool:
    command: "php bin/grpc-worker.php"
    num_workers: 1
    max_jobs: 1000
    allocate_timeout: 60s
    destroy_timeout: 60s
