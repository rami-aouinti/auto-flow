parameters:
    app.order_offer_service_url: '%env(resolve:ORDER_OFFER_SERVICE_URL)%'
    app.order_pricing_service_url: '%env(resolve:ORDER_PRICING_SERVICE_URL)%'
    app.order_catalog_service_url: '%env(resolve:ORDER_CATALOG_SERVICE_URL)%'
    app.order_customer_service_url: '%env(resolve:ORDER_CUSTOMER_SERVICE_URL)%'
    app.order_payment_shared_secret: '%env(ORDER_PAYMENT_SHARED_SECRET)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Domain/'

    App\Infrastructure\Health\OrderDatabaseHealthCheck:
        tags: ['autoflow_core.health_check']

    App\Application\Port\OrderRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineOrderRepository

    App\Infrastructure\Upstream\HttpOrderReferenceValidator:
        arguments:
            $offerServiceUrl: '%app.order_offer_service_url%'
            $pricingServiceUrl: '%app.order_pricing_service_url%'
            $catalogServiceUrl: '%app.order_catalog_service_url%'
            $customerServiceUrl: '%app.order_customer_service_url%'

    App\Application\Port\OrderReferenceValidatorInterface:
        alias: App\Infrastructure\Upstream\HttpOrderReferenceValidator

    App\Presentation\Http\Controller\InternalPaymentContextController:
        arguments:
            $paymentSharedSecret: '%app.order_payment_shared_secret%'
