core:
    correlation_id: true
    correlation_header: X-Correlation-ID
    authentication:
        enabled: true
        issuer: '%env(AUTOFLOW_JWT_ISSUER)%'
        audience: 'autoflow-audit'
        jwks_uri: '%env(AUTOFLOW_JWT_JWKS_URI)%'
        jwks_cache_ttl: 300
        protected_path_prefixes: ['/api/']
        tenant_required_path_prefixes: ['/api/v1/audit/']
        excluded_paths: []
