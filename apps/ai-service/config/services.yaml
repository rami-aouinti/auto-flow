parameters:
    app.ai.ollama_base_uri: '%env(OLLAMA_BASE_URI)%'
    app.ai.ollama_model: '%env(OLLAMA_MODEL)%'
services:
    _defaults:
        autowire: true
        autoconfigure: true
    App\\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Infrastructure/Health/OpenAiConfigurationHealthCheck.php'
    App\\Infrastructure\\AI\\OllamaChatProvider:
        arguments:
            $baseUri: '%app.ai.ollama_base_uri%'
            $model: '%app.ai.ollama_model%'
    App\\Infrastructure\\Health\\OllamaHealthCheck:
        arguments:
            $baseUri: '%app.ai.ollama_base_uri%'
            $model: '%app.ai.ollama_model%'
    App\\Application\\Port\\Out\\ChatProviderInterface:
        alias: App\\Infrastructure\\AI\\OllamaChatProvider
