services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\Infrastructure\Persistence\PostgresConnection:
        arguments:
            - '%env(resolve:DATABASE_URL)%'

    App\Application\Port\VehicleCatalogRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineVehicleCatalogRepository