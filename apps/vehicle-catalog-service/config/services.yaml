services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/Domain/'
            - '../src/Infrastructure/Persistence/Doctrine/Entity/'
            - '../src/Infrastructure/Persistence/PostgresConnection.php'

    App\Application\Port\VehicleCatalogRepositoryInterface:
        alias: App\Infrastructure\Persistence\Doctrine\DoctrineVehicleCatalogRepository