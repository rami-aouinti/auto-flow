nelmio_api_doc:
    documentation:
        info:
            title: AutoFlow Vehicle Catalog API
            description: Authoritative vehicle identity and technical catalogue. No pricing or order availability.
            version: 1.0.0
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - bearerAuth: []
    models:
        names:
            - { alias: ManufacturerResponse, type: App\Presentation\Http\Dto\Response\ManufacturerResponse }
            - { alias: VehicleResponse, type: App\Presentation\Http\Dto\Response\VehicleResponse }
    areas:
        path_patterns:
            - ^/api/v1