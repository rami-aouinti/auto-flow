core:
    authentication:
        enabled: true
        issuer: '%env(AUTOFLOW_JWT_ISSUER)%'
        audience: 'autoflow-pricing'
        jwks_uri: '%env(resolve:AUTOFLOW_JWT_JWKS_URI)%'
        jwks_cache_ttl: 300
        protected_path_prefixes:
            - '/api/'
        tenant_required_path_prefixes:
            - '/api/pricing/'
        excluded_paths:
            - '/api/doc'
            - '/api/doc.json'
