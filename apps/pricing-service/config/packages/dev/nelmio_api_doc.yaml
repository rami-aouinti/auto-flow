nelmio_api_doc:
    documentation:
        info:
            title: AutoFlow Pricing Service API
            description: REST API for vehicle leasing quote calculations.
            version: 1.0.0
        servers:
            - url: http://localhost:8082
              description: Local development
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - bearerAuth: []
        paths:
            /api/pricing/quotes:
                post:
                    tags: [Pricing]
                    summary: Calculate a vehicle leasing quote
                    description: Validates lease inputs and delegates the calculation to the Pricing Application handler.
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    required:
                                        - vehicleId
                                        - vehiclePrice
                                        - downPayment
                                        - residualValue
                                        - currency
                                        - durationMonths
                                        - annualInterestRateBasisPoints
                                    properties:
                                        vehicleId:
                                            type: string
                                            example: vehicle-001
                                        vehiclePrice:
                                            type: string
                                            description: Decimal amount represented as a string to avoid JSON floating-point ambiguity.
                                            example: "42000.00"
                                        downPayment:
                                            type: string
                                            example: "5000.00"
                                        residualValue:
                                            type: string
                                            example: "12000.00"
                                        currency:
                                            type: string
                                            minLength: 3
                                            maxLength: 3
                                            example: EUR
                                        durationMonths:
                                            type: integer
                                            minimum: 1
                                            example: 48
                                        annualInterestRateBasisPoints:
                                            type: integer
                                            minimum: 0
                                            example: 499
                    responses:
                        '200':
                            description: Quote calculated successfully.
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        required:
                                            - vehicleId
                                            - monthlyAmount
                                            - totalInstallmentsAmount
                                            - totalCostIncludingDownPayment
                                            - residualValue
                                            - currency
                                            - durationMonths
                                            - annualInterestRateBasisPoints
                                            - calculationVersion
                                        properties:
                                            vehicleId:
                                                type: string
                                            monthlyAmount:
                                                type: string
                                                example: "689.42"
                                            totalInstallmentsAmount:
                                                type: string
                                                example: "33092.16"
                                            totalCostIncludingDownPayment:
                                                type: string
                                                example: "38092.16"
                                            residualValue:
                                                type: string
                                                example: "12000.00"
                                            currency:
                                                type: string
                                                example: EUR
                                            durationMonths:
                                                type: integer
                                                example: 48
                                            annualInterestRateBasisPoints:
                                                type: integer
                                                example: 499
                                            calculationVersion:
                                                type: string
                                                example: annuity-v1
                        '422':
                            description: Invalid quote input.
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            error:
                                                type: string
                                                example: invalid_pricing_request
                                            message:
                                                type: string
            /api/pricing/quotes/{quoteId}:
                get:
                    tags: [Pricing]
                    summary: Retrieve a quote owned by the caller or visible to an authorized tenant administrator.
                    parameters:
                        - name: quoteId
                          in: path
                          required: true
                          schema: { type: string, pattern: '^[a-f0-9]{32}                get:
                    tags: [Pricing]
                    summary: Retrieve the legacy demonstration quote
                    deprecated: true
                    parameters:
                        - name: vehicleId
                          in: path
                          required: true
                          schema:
                              type: string
                    responses:
                        '200':
                            description: Static demonstration pricing response. Use POST /api/pricing/quotes for calculations.
                            content:
                                application/json:
                                    schema:
                                        type: object
                                        properties:
                                            vehicleId:
                                                type: string
                                            monthlyAmount:
                                                type: number
                                            currency:
                                                type: string
                                            durationMonths:
                                                type: integer
                                            calculation:
                                                type: string
                                                example: demo-only
    areas:
        path_patterns:
            - ^/api(?!/doc)
