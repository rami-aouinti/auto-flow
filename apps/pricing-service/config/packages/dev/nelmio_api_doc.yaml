nelmio_api_doc:
    documentation:
        info:
            title: AutoFlow Pricing Service API
            description: Tenant-scoped lease quote calculation and lifecycle.
            version: 1.0.0
        servers:
            - url: http://localhost:8082
              description: Local development
        components:
            securitySchemes:
                bearerAuth:
                    type: http
                    scheme: bearer
                    bearerFormat: JWT
        security:
            - bearerAuth: []
        paths:
            /api/pricing/quotes:
                post:
                    tags: [Pricing]
                    summary: Calculate and persist a lease quote
                    requestBody:
                        required: true
                        content:
                            application/json:
                                schema:
                                    type: object
                                    additionalProperties: false
                                    required: [vehicleId, vehiclePrice, downPayment, residualValue, currency, durationMonths, annualInterestRateBasisPoints]
                                    properties:
                                        vehicleId: { type: string, example: vehicle-demo-001 }
                                        vehiclePrice: { type: string, example: '30000.00' }
                                        downPayment: { type: string, example: '5000.00' }
                                        residualValue: { type: string, example: '12000.00' }
                                        currency: { type: string, example: EUR }
                                        durationMonths: { type: integer, minimum: 12, maximum: 72, example: 48 }
                                        annualInterestRateBasisPoints: { type: integer, minimum: 0, maximum: 2000, example: 450 }
                                examples:
                                    demo:
                                        summary: Deterministic demo vehicle quote
                                        value:
                                            vehicleId: vehicle-demo-001
                                            vehiclePrice: '30000.00'
                                            downPayment: '5000.00'
                                            residualValue: '12000.00'
                                            currency: EUR
                                            durationMonths: 48
                                            annualInterestRateBasisPoints: 450
                    responses:
                        '200':
                            description: Quote calculated and persisted
                            content:
                                application/json:
                                    example:
                                        quoteId: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                                        vehicleId: vehicle-demo-001
                                        vehiclePrice: '30000.00'
                                        downPayment: '5000.00'
                                        monthlyAmount: '455.46'
                                        totalInstallmentsAmount: '21862.08'
                                        totalCostIncludingDownPayment: '26862.08'
                                        residualValue: '12000.00'
                                        currency: EUR
                                        durationMonths: 48
                                        annualInterestRateBasisPoints: 450
                                        calculationVersion: lease-annuity-v1
                                        createdAt: '2026-11-04T12:00:00+00:00'
                                        expiresAt: '2026-11-11T12:00:00+00:00'
                                        policyId: '123e4567-e89b-42d3-a456-426614174000'
                                        policyVersion: 1
                                        expired: false
                        '400': { description: Malformed JSON request body }
                        '401': { description: Missing or invalid bearer token }
                        '403': { description: Missing pricing scope or tenant authorization }
                        '422': { description: Invalid request or lease terms }
                        '500': { description: Unexpected pricing failure }
                get:
                    tags: [Pricing]
                    summary: List quotes visible to the caller
                    parameters:
                        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
                        - { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
                    responses:
                        '200':
                            description: Paginated quote collection. Fixture rows are visible to the fixture owner or callers with the tenant read-any scope.
                            content:
                                application/json:
                                    example:
                                        items:
                                            - quoteId: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
                                              vehicleId: vehicle-demo-001
                                              vehiclePrice: '30000.00'
                                              downPayment: '5000.00'
                                              monthlyAmount: '455.46'
                                              totalInstallmentsAmount: '21862.08'
                                              totalCostIncludingDownPayment: '26862.08'
                                              residualValue: '12000.00'
                                              currency: EUR
                                              durationMonths: 48
                                              annualInterestRateBasisPoints: 450
                                              calculationVersion: lease-annuity-v1
                                              createdAt: '2026-11-04T12:00:00+00:00'
                                              expiresAt: '2026-11-11T12:00:00+00:00'
                                              policyId: '123e4567-e89b-42d3-a456-426614174000'
                                              policyVersion: 1
                                              expired: false
                                            - quoteId: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
                                              vehicleId: vehicle-demo-002
                                              vehiclePrice: '25000.00'
                                              downPayment: '4000.00'
                                              monthlyAmount: '389.90'
                                              totalInstallmentsAmount: '14036.40'
                                              totalCostIncludingDownPayment: '18036.40'
                                              residualValue: '7500.00'
                                              currency: EUR
                                              durationMonths: 36
                                              annualInterestRateBasisPoints: 350
                                              calculationVersion: lease-annuity-v1
                                              createdAt: '2026-11-04T12:00:00+00:00'
                                              expiresAt: '2026-11-11T12:00:00+00:00'
                                              policyId: '123e4567-e89b-42d3-a456-426614174000'
                                              policyVersion: 1
                                              expired: false
                                        limit: 50
                                        offset: 0
                        '400': { description: Invalid pagination }
            /api/pricing/quotes/{quoteId}:
                get:
                    tags: [Pricing]
                    summary: Retrieve a quote snapshot
                    parameters:
                        - { name: quoteId, in: path, required: true, schema: { type: string } }
                    responses:
                        '200': { description: Quote snapshot and validity metadata }
                        '404': { description: Quote not found or not visible to caller }
                        '410': { description: Quote expired }
                delete:
                    tags: [Pricing]
                    summary: Soft-delete a quote
                    parameters:
                        - { name: quoteId, in: path, required: true, schema: { type: string } }
                    responses:
                        '204': { description: Quote soft-deleted }
                        '404': { description: Quote not found or not visible to caller }
            /api/pricing/{vehicleId}:
                get:
                    tags: [Pricing]
                    summary: Legacy static demonstration quote
                    deprecated: true
                    parameters:
                        - { name: vehicleId, in: path, required: true, schema: { type: string } }
                    responses:
                        '200': { description: Static demonstration response }
            /health:
                get:
                    summary: Liveness probe
                    responses:
                        '200': { description: Process is alive }
            /ready:
                get:
                    summary: PostgreSQL readiness probe
                    responses:
                        '200': { description: PostgreSQL is reachable }
                        '503': { description: PostgreSQL is unavailable }
    areas:
        default:
            path_patterns:
                - '^/api(?!/doc)'
