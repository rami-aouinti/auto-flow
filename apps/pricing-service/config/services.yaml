services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'
            - '../src/App/Grpc/Generated/'

    App\Infrastructure\Persistence\PostgresConnection:
        arguments:
            - '%env(resolve:DATABASE_URL)%'

    App\Application\Port\Out\PricingQuoteRepositoryInterface:
        alias: App\Infrastructure\Persistence\PostgresPricingQuoteRepository

    App\Application\Port\Out\PricingPolicyRepositoryInterface:
        alias: App\Infrastructure\Persistence\PostgresPricingPolicyRepository

    App\Application\Port\Out\QuoteIdGeneratorInterface:
        alias: App\Infrastructure\Persistence\RandomQuoteIdGenerator

    App\Infrastructure\Health\PricingDatabaseHealthCheck:
        tags: ['autoflow_core.health_check']

    App\Grpc\PricingGrpcService:
        public: true
