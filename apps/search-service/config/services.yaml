services:
    _defaults:
        autowire: true
        autoconfigure: true

    App\\:
        resource: '../src/'
        exclude:
            - '../src/Kernel.php'

    App\\Infrastructure\\Elasticsearch\\ElasticsearchClient:
        arguments:
            $baseUri: '%env(ELASTICSEARCH_URL)%'
            $indexName: '%env(SEARCH_VEHICLE_INDEX)%'

    App\\Infrastructure\\Health\\SearchReadinessCheck:
        tags: ['autoflow_core.health_check']
