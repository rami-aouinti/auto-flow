parameters:
    app.document_service_url: '%env(resolve:DOCUMENT_SERVICE_URL)%'

services:
    _defaults: {autowire: true, autoconfigure: true}
    App\:
        resource: '../src/'
        exclude: ['../src/Kernel.php']
    App\Infrastructure\Health\BillingDatabaseHealthCheck:
        tags: ['autoflow_core.health_check']
    App\Infrastructure\Document\DocumentServiceClient:
        arguments:
            $baseUrl: '%app.document_service_url%'
