apiVersion: v1
kind: Secret
metadata:
  name: billing-secret
  namespace: autoflow
type: Opaque
stringData:
  BILLING_DATABASE_URL: "postgresql://REPLACE_USER:REPLACE_PASSWORD@postgres:5432/autoflow"
  RABBITMQ_PASSWORD: "REPLACE_WITH_SECRET"
  APP_SECRET: "REPLACE_WITH_RANDOM_SECRET"
  AUTOFLOW_JWT_ISSUER: "https://identity.example/realms/autoflow"
  AUTOFLOW_JWT_JWKS_URI: "https://identity.example/realms/autoflow/protocol/openid-connect/certs"
