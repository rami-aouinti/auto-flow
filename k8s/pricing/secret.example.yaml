# Local learning template only.
# Copy to secret.yaml, replace both values, and apply secret.yaml.
# Never commit secret.yaml or real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: pricing-secret
  namespace: autoflow
  labels:
    app.kubernetes.io/name: pricing-service
type: Opaque
stringData:
  APP_SECRET: "REPLACE_WITH_A_RANDOM_SECRET"
  DATABASE_URL: "postgresql://autoflow_pricing:REPLACE_WITH_LOCAL_PASSWORD@host.docker.internal:5432/autoflow?serverVersion=16&charset=utf8"
