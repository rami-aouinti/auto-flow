apiVersion: v1
kind: Service
metadata:
  name: pricing-service
  namespace: autoflow
  labels:
    app.kubernetes.io/name: pricing-service
    app.kubernetes.io/part-of: autoflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: pricing-service
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: grpc
      port: 9001
      targetPort: grpc
      protocol: TCP
