apiVersion: v1
kind: ConfigMap
metadata:
  name: customer-config
  namespace: autoflow
data:
  APP_ENV: "prod"
  APP_DEBUG: "0"
  AUTOFLOW_JWT_ISSUER: "http://keycloak:8080/realms/autoflow"
  AUTOFLOW_JWT_JWKS_URI: "http://keycloak:8080/realms/autoflow/protocol/openid-connect/certs"
  OTEL_SERVICE_NAME: "autoflow-customer-service"
  OTEL_RESOURCE_ATTRIBUTES: "service.namespace=autoflow,deployment.environment=production"
  OTEL_PHP_AUTOLOAD_ENABLED: "true"
  OTEL_TRACES_EXPORTER: "otlp"
  OTEL_METRICS_EXPORTER: "otlp"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://tempo:4318"
