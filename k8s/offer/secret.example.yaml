# Local learning template only. Copy to secret.yaml, replace values, and apply.
# Never commit secret.yaml or real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: offer-secret
  namespace: autoflow
  labels:
    app.kubernetes.io/name: offer-service
type: Opaque
stringData:
  APP_SECRET: "REPLACE_WITH_A_RANDOM_SECRET"
  OFFER_DATABASE_URL: "postgresql://autoflow_offer:REPLACE_WITH_LOCAL_PASSWORD@host.docker.internal:5432/autoflow"
  PRICING_CLIENT_SECRET: "REPLACE_WITH_LOCAL_CLIENT_SECRET"
  KEYCLOAK_TOKEN_URL: "http://host.docker.internal:8080/realms/autoflow/protocol/openid-connect/token"
  RABBITMQ_PASSWORD: "REPLACE_WITH_LOCAL_RABBITMQ_PASSWORD"
