apiVersion: batch/v1
kind: CronJob
metadata:
  name: offer-expiration
  namespace: autoflow
  labels:
    app.kubernetes.io/name: offer-expiration
    app.kubernetes.io/part-of: autoflow
spec:
  schedule: "*/1 * * * *"
  timeZone: "Europe/Berlin"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 3
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: offer-expiration
            app.kubernetes.io/part-of: autoflow
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            fsGroup: 33
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: expire-offers
              image: autoflow/offer-service:local
              imagePullPolicy: Never
              command: ["php", "bin/expire-offers.php", "--once"]
              envFrom:
                - configMapRef:
                    name: offer-config
                - secretRef:
                    name: offer-secret
              resources:
                requests:
                  cpu: 50m
                  memory: 96Mi
                limits:
                  cpu: 500m
                  memory: 256Mi
              volumeMounts:
                - name: app-var
                  mountPath: /app/var
                - name: tmp
                  mountPath: /tmp
              securityContext:
                readOnlyRootFilesystem: true
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
          volumes:
            - name: app-var
              emptyDir: {}
            - name: tmp
              emptyDir: {}
