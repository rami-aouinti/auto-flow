# Local learning template only. Copy to secret.yaml, replace values, and apply.
# Never commit secret.yaml or real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: vehicle-catalog-secret
  namespace: autoflow
  labels:
    app.kubernetes.io/name: vehicle-catalog-service
type: Opaque
stringData:
  APP_SECRET: "REPLACE_WITH_A_RANDOM_SECRET"
  DATABASE_URL: "postgresql://autoflow_catalog:REPLACE_WITH_LOCAL_PASSWORD@host.docker.internal:5432/autoflow"
  RABBITMQ_PASSWORD: "REPLACE_WITH_LOCAL_RABBITMQ_PASSWORD"
