apiVersion: apps/v1
kind: Deployment
metadata:
  name: contract-service
  namespace: autoflow
  labels:
    app.kubernetes.io/name: contract-service
    app.kubernetes.io/part-of: autoflow
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: contract-service
  template:
    metadata:
      labels:
        app: contract-service
        app.kubernetes.io/name: contract-service
        app.kubernetes.io/part-of: autoflow
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: contract-service
          image: autoflow/contract-service:local
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: contract-config
            - secretRef:
                name: contract-secret
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 150m
              memory: 192Mi
            limits:
              cpu: 750m
              memory: 768Mi
          volumeMounts:
            - name: contract-documents
              mountPath: /var/lib/autoflow/contracts
            - name: docusign-key
              mountPath: /var/run/secrets/docusign
              readOnly: true
            - name: app-var
              mountPath: /app/var
            - name: tmp
              mountPath: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 33
            runAsGroup: 33
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: contract-documents
          persistentVolumeClaim:
            claimName: contract-documents
        - name: docusign-key
          secret:
            secretName: docusign-rsa-key
            defaultMode: 0440
        - name: app-var
          emptyDir: {}
        - name: tmp
          emptyDir: {}
