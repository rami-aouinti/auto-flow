apiVersion: v1
kind: Secret
metadata:
  name: contract-secret
  namespace: autoflow
type: Opaque
stringData:
  APP_SECRET: "replace-with-a-long-random-secret"
  CONTRACT_DATABASE_URL: "postgresql://autoflow_contract:replace-me@postgres:5432/autoflow"
  DOCUSIGN_INTEGRATION_KEY: "replace-with-docusign-integration-key"
  DOCUSIGN_USER_ID: "replace-with-docusign-user-guid"
  DOCUSIGN_ACCOUNT_ID: "replace-with-docusign-account-guid"
  DOCUSIGN_WEBHOOK_HMAC_KEY: "replace-with-docusign-connect-hmac-key"
