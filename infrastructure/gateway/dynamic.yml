# Traefik dynamic configuration for the AutoFlow API edge.
# Paths are intentionally preserved: each Symfony service owns its /api route contract.
http:
  middlewares:
    api-security-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin
        permissionsPolicy: "camera=(), microphone=(), geolocation=()"

    api-cors:
      headers:
        accessControlAllowOriginList:
          - "http://localhost:3000"
          - "http://127.0.0.1:3000"
          - "http://localhost:8096"
          - "http://127.0.0.1:8096"
        accessControlAllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - OPTIONS
        accessControlAllowHeaders:
          - Accept
          - Authorization
          - Content-Type
          - Idempotency-Key
          - If-Match
          - Stripe-Signature
          - Origin
          - X-Correlation-ID
        accessControlExposeHeaders:
          - ETag
          - Retry-After
          - X-Correlation-ID
        accessControlMaxAge: 600
        addVaryHeader: true

    api-rate-limit:
      rateLimit:
        average: 120
        period: 1m
        burst: 60

    api-in-flight:
      inFlightReq:
        amount: 100

    api-defaults:
      chain:
        middlewares:
          - api-security-headers
          - api-cors
          - api-rate-limit
          - api-in-flight

  routers:
    ai:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/ai`)"
      service: ai
      middlewares: [api-defaults]

    contract-webhook:
      entryPoints: [web]
      rule: "Path(`/webhooks/docusign`)"
      service: contracts
      middlewares: [api-defaults]

    contracts:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/contracts`)"
      service: contracts
      middlewares: [api-defaults]

    billing:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/billing`)"
      service: billing
      middlewares: [api-defaults]

    crm:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/crm`)"
      service: crm
      middlewares: [api-defaults]

    customers:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/customers`)"
      service: customers
      middlewares: [api-defaults]

    catalog:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/manufacturers`) || PathPrefix(`/api/v1/models`) || PathPrefix(`/api/v1/generations`) || PathPrefix(`/api/v1/vehicles`) || PathPrefix(`/api/v1/admin/catalog`)"
      service: catalog
      middlewares:
        - api-defaults

    offers:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/offers`)"
      service: offers
      middlewares:
        - api-defaults

    pricing:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/pricing`)"
      service: pricing
      middlewares:
        - api-defaults

    documents:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/documents`)"
      service: documents
      middlewares: [api-defaults]

    search:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/search`)"
      service: search
      middlewares: [api-defaults]

    orders:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/orders`)"
      service: orders
      middlewares:
        - api-defaults

    payments:
      entryPoints:
        - web
      rule: "PathPrefix(`/api/v1/payments`)"
      service: payments
      middlewares:
        - api-defaults

    reservations:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/reservations`)"
      service: reservations
      middlewares: [api-defaults]

    fulfillments:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/fulfillments`)"
      service: fulfillments
      middlewares: [api-defaults]

    inventory:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/inventory`)"
      service: inventory
      middlewares: [api-defaults]

    audit:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/audit`)"
      service: audit
      middlewares: [api-defaults]

    analytics:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/analytics`)"
      service: analytics
      middlewares: [api-defaults]

    integrations:
      entryPoints: [web]
      rule: "PathPrefix(`/api/v1/integrations`) || PathPrefix(`/webhooks/`)"
      service: integrations
      middlewares: [api-defaults]

  services:
    ai:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://ai-service:8080"

    contracts:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: "http://contract-service:8080"
        healthCheck:
          path: /health/ready
          interval: 10s
          timeout: 3s

    billing:
