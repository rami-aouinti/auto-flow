apiVersion: v1
kind: ConfigMap
metadata:
  name: document-service-config
  namespace: autoflow
data:
  APP_ENV: "prod"
  DOCUMENT_STORAGE_DRIVER: "s3"
  DOCUMENT_S3_ENDPOINT: "https://s3.example.internal"
  DOCUMENT_S3_BUCKET: "autoflow-documents"
  DOCUMENT_S3_REGION: "eu-central-1"
  DOCUMENT_RETENTION_INTERVAL_SECONDS: "3600"
  DOCUMENT_RETENTION_BATCH_SIZE: "25"
  RABBITMQ_MANAGEMENT_URL: "http://rabbitmq:15672"
  DOCUMENT_EVENTS_EXCHANGE: "autoflow.document.events"
  DOCUMENT_OUTBOX_INTERVAL_SECONDS: "2"
  CLAMAV_HOST: "clamav"
  CLAMAV_PORT: "3310"
  AUTOFLOW_JWT_ISSUER: "https://identity.example.com/realms/autoflow"
  AUTOFLOW_JWT_JWKS_URI: "https://identity.example.com/realms/autoflow/protocol/openid-connect/certs"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-service
  namespace: autoflow
  labels:
    app.kubernetes.io/name: document-service
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: document-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-service
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/rami-aouinti/auto-flow-document-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: document-service-config
          env:
            - name: DOCUMENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: autoflow-document-secrets
                  key: document-database-url
            - name: DOCUMENT_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: autoflow-document-secrets
                  key: s3-access-key
            - name: DOCUMENT_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: autoflow-document-secrets
                  key: s3-secret-key
            - name: DOCUMENT_S3_SSE_C_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: autoflow-document-secrets
                  key: s3-sse-c-key-base64
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: document-service
  namespace: autoflow
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: document-service
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-outbox-publisher
  namespace: autoflow
  labels:
    app.kubernetes.io/name: document-outbox-publisher
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: document-outbox-publisher
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-outbox-publisher
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: publisher
          image: ghcr.io/rami-aouinti/auto-flow-document-service:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "/app/bin/publish-outbox.php"]
          envFrom:
            - configMapRef:
                name: document-service-config
          env:
            - name: DOCUMENT_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: autoflow-document-secrets
                  key: document-database-url
            - name: RABBITMQ_USER
              valueFrom:
                secretKeyRef:
                  name: autoflow-document-secrets
                  key: rabbitmq-user
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: autoflow-document-secrets
                  key: rabbitmq-password
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: document-retention-worker
  namespace: autoflow
  labels:
    app.kubernetes.io/name: document-retention-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: document-retention-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: document-retention-worker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: retention
          image: ghcr.io/rami-aouinti/auto-flow-document-service:latest
          imagePullPolicy: IfNotPresent
          command: ["php", "/app/bin/expire-retention.php"]
          envFrom:
            - configMapRef:
                name: document-service-config
          env:
            - name: DOCUMENT_MAINTENANCE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: autoflow-document-secrets
                  key: document-maintenance-database-url
            - name: DOCUMENT_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: autoflow-document-secrets
                  key: s3-access-key
            - name: DOCUMENT_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: autoflow-document-secrets
                  key: s3-secret-key
            - name: DOCUMENT_S3_SSE_C_KEY_BASE64
              valueFrom:
                secretKeyRef:
                  name: autoflow-document-secrets
                  key: s3-sse-c-key-base64
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: document-service
  namespace: autoflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: document-service
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
