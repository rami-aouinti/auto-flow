      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-autoflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-autoflow}
      RABBITMQ_VHOST: /
      OTEL_SERVICE_NAME: autoflow-vehicle-catalog-outbox-publisher
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=autoflow,deployment.environment=local
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on:
      tempo:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  offer-workers:
    build:
      context: .
      dockerfile: docker/php/service.Dockerfile
      args:
        SERVICE_PATH: apps/offer-service
        COMPOSER_NO_DEV: ""
        ROADRUNNER_BOOT_CHECK: "0"
    command: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisor/conf.d/offer-workers.conf"]
    environment:
      APP_ENV: prod
      OFFER_DATABASE_URL: ${OFFER_DATABASE_URL:-postgresql://autoflow_offer:local-only-offer-password@postgres:5432/autoflow}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER:-autoflow}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-autoflow}
      RABBITMQ_VHOST: /
      OTEL_SERVICE_NAME: autoflow-offer-workers
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=autoflow,deployment.environment=local
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: none
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_PROPAGATORS: tracecontext,baggage
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      tempo:
        condition: service_started
    init: true
    restart: unless-stopped


  notification-service:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    environment:
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      RABBITMQ_VHOST: /
      KEYCLOAK_BASE_URL: http://keycloak:8080
      KEYCLOAK_REALM: autoflow
      KEYCLOAK_NOTIFICATION_CLIENT_ID: ${KEYCLOAK_NOTIFICATION_CLIENT_ID}
      KEYCLOAK_NOTIFICATION_CLIENT_SECRET: ${KEYCLOAK_NOTIFICATION_CLIENT_SECRET}
      MAILER_DSN: ${MAILER_DSN}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      mailpit:
        condition: service_started
    init: true
    restart: unless-stopped

  notification-metrics:
    build:
      context: .
      dockerfile: apps/notification-service/Dockerfile
    command: ["php", "-S", "0.0.0.0:9464", "-t", "public", "public/metrics.php"]
    environment:
      NOTIFICATION_DATABASE_URL: ${NOTIFICATION_DATABASE_URL}
    expose:
      - "9464"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  pricing-service:
    build:
      context: .
      dockerfile: docker/php/service.Dockerfile
      args:
        SERVICE_PATH: apps/pricing-service
        COMPOSER_NO_DEV: ""
    ports:
      - "8082:8080"
      - "127.0.0.1:9002:9001"
    environment:
      # Swagger is available in the local development environment only.
      # Set PRICING_APP_ENV=prod and PRICING_APP_DEBUG=0 for production deployments.
      APP_ENV: ${PRICING_APP_ENV:-dev}
      APP_DEBUG: ${PRICING_APP_DEBUG:-1}
      APP_SECRET: local-only-pricing-service-secret
      DATABASE_URL: ${PRICING_DATABASE_URL:-postgresql://autoflow_pricing:local-only-pricing-password@postgres:5432/autoflow?serverVersion=16&charset=utf8}
      DEFAULT_URI: http://localhost:8082
      AUTOFLOW_JWT_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8080/realms/autoflow}
      AUTOFLOW_JWT_JWKS_URI: ${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/autoflow/protocol/openid-connect/certs}
      OTEL_SERVICE_NAME: autoflow-pricing-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=autoflow,deployment.environment=local
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      # Export often enough for local dashboards while keeping a bounded batch cadence.
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      OTEL_METRIC_EXPORT_TIMEOUT: "5000"
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://alloy:4318/v1/metrics
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_PHP_EXCLUDED_URLS: ^/(health|ready)$
    depends_on:
      postgres:
        condition: service_healthy
      tempo:
        condition: service_started
      alloy:
        condition: service_started
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/ready') === false ? 1 : 0);"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  temporal:
    # Local development server with persistent SQLite state. Not a production cluster.
    image: temporalio/temporal:1.6.2
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"
      - "127.0.0.1:8233:8233"
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "127.0.0.1:7233"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    init: true
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.3.5
    command: ["start-dev", "--import-realm", "--health-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./infrastructure/keycloak/realm:/opt/keycloak/data/import:ro
    restart: unless-stopped

  adminer:
    image: adminer:5.4.1
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: pepa-linha
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoflow}
      POSTGRES_USER: ${POSTGRES_USER:-autoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoflow}
    ports: ["5432:5432"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/pricing-service/migrations/00_create_pricing_database_role.sql:/docker-entrypoint-initdb.d/10-pricing-role.sql:ro
      - ./apps/pricing-service/migrations/Version20261104000100CreatePricingQuotes.sql:/docker-entrypoint-initdb.d/20-pricing-quotes.sql:ro
      - ./apps/pricing-service/migrations/Version20261104000200AddPricingQuoteSoftDelete.sql:/docker-entrypoint-initdb.d/30-pricing-quote-soft-delete.sql:ro
      - ./apps/pricing-service/migrations/Version20261104000300AddPricingQuoteOwner.sql:/docker-entrypoint-initdb.d/40-pricing-quote-owner.sql:ro
      - ./apps/pricing-service/migrations/Version20261106000100CreatePricingPoliciesAndQuoteSnapshots.sql:/docker-entrypoint-initdb.d/45-pricing-policy-snapshots.sql:ro
      - ./apps/offer-service/migrations/00_create_offer_database_role.sql:/docker-entrypoint-initdb.d/50-offer-role.sql:ro
      - ./apps/offer-service/migrations/Version20261104000400CreateOffers.sql:/docker-entrypoint-initdb.d/60-offers.sql:ro
      - ./apps/offer-service/migrations/Version20261104000500CreateOfferOutbox.sql:/docker-entrypoint-initdb.d/70-offer-outbox.sql:ro
      - ./apps/offer-service/migrations/Version20261104000600AddOfferLifecycleTimestamps.sql:/docker-entrypoint-initdb.d/80-offer-lifecycle-timestamps.sql:ro
      - ./apps/offer-service/migrations/Version20261106000700CreateOfferAuditEvents.sql:/docker-entrypoint-initdb.d/85-offer-audit.sql:ro
      - ./apps/vehicle-catalog-service/migrations/00_create_catalog_database_role.sql:/docker-entrypoint-initdb.d/090-catalog-role.sql:ro
      - ./apps/vehicle-catalog-service/migrations/Version20261105000100CreateVehicleCatalog.sql:/docker-entrypoint-initdb.d/100-catalog-schema.sql:ro
      - ./apps/vehicle-catalog-service/fixtures/vehicle_catalog_demo.sql:/docker-entrypoint-initdb.d/110-catalog-demo.sql:ro
      - ./apps/order-service/migrations/00_create_order_database_role.sql:/docker-entrypoint-initdb.d/120-order-role.sql:ro
      - ./apps/order-service/migrations/Version20261106000100CreateOrders.sql:/docker-entrypoint-initdb.d/130-order-schema.sql:ro
      - ./apps/order-service/migrations/Version20261106000200AddOrderTransitionIdempotency.sql:/docker-entrypoint-initdb.d/140-order-transition-idempotency.sql:ro
      - ./apps/payment-service/migrations/00_create_payment_database_role.sql:/docker-entrypoint-initdb.d/150-payment-role.sql:ro
      - ./apps/order-service/migrations/Version20261106000300AddPaymentLifecycle.sql:/docker-entrypoint-initdb.d/145-order-payment-lifecycle.sql:ro
      - ./apps/payment-service/migrations/140-payment-schema.sql:/docker-entrypoint-initdb.d/160-payment-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-autoflow} -d ${POSTGRES_DB:-autoflow}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Reapply idempotent Order/Payment SQL on both fresh and existing PostgreSQL volumes.
  postgres-bootstrap:
    image: postgres:16-alpine
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=1 -f /migrations/120-order-role.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/130-order-schema.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/140-order-transition-idempotency.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/145-order-payment-lifecycle.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/150-payment-role.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/160-payment-schema.sql
        psql -v ON_ERROR_STOP=1 -f /migrations/170-billing-schema.sql
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:-autoflow}
      PGUSER: ${POSTGRES_USER:-autoflow}
      PGPASSWORD: ${POSTGRES_PASSWORD:-autoflow}
    volumes:
      - ./apps/order-service/migrations/00_create_order_database_role.sql:/migrations/120-order-role.sql:ro
      - ./apps/order-service/migrations/Version20261106000100CreateOrders.sql:/migrations/130-order-schema.sql:ro
      - ./apps/order-service/migrations/Version20261106000200AddOrderTransitionIdempotency.sql:/migrations/140-order-transition-idempotency.sql:ro
      - ./apps/order-service/migrations/Version20261106000300AddPaymentLifecycle.sql:/migrations/145-order-payment-lifecycle.sql:ro
      - ./apps/payment-service/migrations/00_create_payment_database_role.sql:/migrations/150-payment-role.sql:ro
      - ./apps/payment-service/migrations/140-payment-schema.sql:/migrations/160-payment-schema.sql:ro
      - ./apps/billing-service/migrations/170-billing-schema.sql:/migrations/170-billing-schema.sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-autoflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-autoflow}
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "listeners"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.5
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      SERVER_NAME: autoflow-kibana
      SERVER_PUBLICBASEURL: http://localhost:5601
    ports: ["5601:5601"]
    depends_on:
      elasticsearch: {condition: service_healthy}

  mercure:
    image: dunglas/mercure:v1.1.5
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:-!ChangeThisMercurePublisherKeyForLocalDevelopmentOnly!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY:-!ChangeThisMercureSubscriberKeyForLocalDevelopmentOnly!}
      MERCURE_EXTRA_DIRECTIVES: "cors_origins http://localhost:3000 http://localhost:8000"
    ports: ["3001:80"]
    volumes:
      - mercure-data:/data
      - mercure-config:/config

  mailpit:
    image: axllent/mailpit:v1.22.3
    ports: ["1025:1025", "8025:8025"]

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - rabbitmq
      - postgres-exporter
      - redis-exporter
      - elasticsearch-exporter
      - cadvisor
      - node-exporter

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3002:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yml"]
    ports: ["3100:3100"]
    volumes:
      - ./infrastructure/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.6.1
    command: ["run", "--stability.level=experimental", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports: ["12345:12345"]
    volumes:
      - ./infrastructure/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports: ["3200:3200", "4317:4317", "4318:4318"]
    volumes:
      - ./infrastructure/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-autoflow}:${POSTGRES_PASSWORD:-autoflow}@postgres:5432/${POSTGRES_DB:-autoflow}?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: {condition: service_healthy}

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.8.0
    command: ["--es.uri=http://elasticsearch:9200"]
    depends_on:
      elasticsearch: {condition: service_healthy}

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro


  web-frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-lc", "npm install --no-audit --no-fund && npm run dev"]
    ports: ["3000:3000"]
    volumes:
      - ./apps/web-frontend:/app
      - web-frontend-node-modules:/app/node_modules
    environment:
      NUXT_TELEMETRY_DISABLED: "1"
      NITRO_PORT: "3000"
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: autoflow
      VITE_KEYCLOAK_CLIENT_ID: autoflow-local-client
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
      # Nitro forwards the existing /catalog, /offers, /pricing, /orders, /payments and /billing
      # browser routes through the gateway; the gateway preserves the upstream /api path.
      CATALOG_PROXY_TARGET: http://api-gateway
      OFFER_PROXY_TARGET: http://api-gateway
      PRICING_PROXY_TARGET: http://api-gateway
      ORDER_PROXY_TARGET: http://api-gateway
      PAYMENT_PROXY_TARGET: http://api-gateway
      BILLING_PROXY_TARGET: http://api-gateway
    depends_on:
      api-gateway: {condition: service_healthy}
      keycloak: {condition: service_started}
    init: true
    restart: unless-stopped

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  elasticsearch-data:
  composer-cache:
  mercure-data:
  mercure-config:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  temporal-data:
  web-frontend-node-modules:
