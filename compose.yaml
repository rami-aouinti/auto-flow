  document-object-storage:
    image: rustfs/rustfs:latest
    command: ["/data"]
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${DOCUMENT_S3_ACCESS_KEY:-AUTOFLOWDOCUMENT}
      RUSTFS_SECRET_KEY: ${DOCUMENT_S3_SECRET_KEY:-local-only-document-object-secret}
      RUSTFS_CHECK_UPDATE: "false"
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - document-object-data:/data
    restart: unless-stopped

  document-object-storage-init:
    image: public.ecr.aws/aws-cli/aws-cli:latest
    depends_on:
      document-object-storage: {condition: service_started}
    entrypoint: ["/bin/sh", "-c"]
    environment:
      AWS_ACCESS_KEY_ID: ${DOCUMENT_S3_ACCESS_KEY:-AUTOFLOWDOCUMENT}
      AWS_SECRET_ACCESS_KEY: ${DOCUMENT_S3_SECRET_KEY:-local-only-document-object-secret}
      AWS_DEFAULT_REGION: ${DOCUMENT_S3_REGION:-us-east-1}
      AWS_EC2_METADATA_DISABLED: "true"
    command:
      - |
        set -e
        endpoint=http://document-object-storage:9000
        bucket=autoflow-documents
        echo "Waiting for RustFS and ensuring bucket $$bucket exists..."
        for attempt in $(seq 1 30); do
          if aws --endpoint-url "$$endpoint" s3api head-bucket --bucket "$$bucket" >/dev/null 2>&1; then
            echo "Bucket $$bucket already exists."
            exit 0
          fi
          if aws --endpoint-url "$$endpoint" s3api create-bucket --bucket "$$bucket" >/dev/null 2>&1; then
            echo "Bucket $$bucket created."
            exit 0
          fi
          echo "RustFS is not ready yet ($$attempt/30)..."
          sleep 2
        done
        echo "Unable to create or access bucket $$bucket."
        exit 1
    restart: "no"
