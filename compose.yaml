        SERVICE_PATH: apps/billing-service
        COMPOSER_NO_DEV: "--no-dev"
        ROADRUNNER_BOOT_CHECK: "0"
    command: ["php", "bin/consume-payment-events.php"]
    environment:
      APP_ENV: prod
      BILLING_DATABASE_URL: ${BILLING_DATABASE_URL:-postgresql://autoflow_billing:local-only-billing-password@postgres:5432/autoflow}
      BILLING_TAX_RATE_BPS: ${BILLING_TAX_RATE_BPS:-1900}
