services:
  # Central Swagger UI for local development; never expose this in production.
  api-docs:
    image: swaggerapi/swagger-ui:v5.18.2
    environment:
      URL: /openapi.json
      DOC_EXPANSION: none
      FILTER: "true"
      DISPLAY_REQUEST_DURATION: "true"
    ports:
      - "127.0.0.1:8096:8080"
    volumes:
      - ./docs/api/openapi.json:/usr/share/nginx/html/openapi.json:ro
    restart: unless-stopped

  # Single HTTP entry point for browser, mobile and external API clients.
  # Backend ports remain published for local diagnostics; clients should use :8088.
  api-gateway:
    image: traefik:v3.6.2
    command:
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--api.dashboard=false"
      - "--api.insecure=false"
      - "--ping=true"
      - "--ping.entrypoint=traefik"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.traefik.address=:8081"
      - "--entrypoints.web.transport.respondingTimeouts.readTimeout=30s"
      - "--entrypoints.web.transport.respondingTimeouts.writeTimeout=30s"
      - "--entrypoints.web.transport.respondingTimeouts.idleTimeout=90s"
      - "--serversTransport.forwardingTimeouts.dialTimeout=5s"
      - "--serversTransport.forwardingTimeouts.responseHeaderTimeout=30s"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--providers.file.watch=true"
      - "--accesslog=true"
      - "--accesslog.format=json"
      - "--accesslog.fields.headers.defaultmode=drop"
      - "--log.level=INFO"
      - "--log.format=json"
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.entrypoint=traefik"
      - "--metrics.prometheus.addEntryPointsLabels=true"
      - "--metrics.prometheus.addRoutersLabels=true"
      - "--metrics.prometheus.addServicesLabels=true"
    ports:
      - "8088:80"
    expose:
      - "8081"
    volumes:
      - ./infrastructure/gateway/dynamic.yml:/etc/traefik/dynamic/dynamic.yml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--entryPoints.traefik.address=:8081", "--ping.entryPoint=traefik", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    depends_on:
      offer-service: {condition: service_healthy}
      pricing-service: {condition: service_healthy}
      vehicle-catalog-service: {condition: service_healthy}
      order-service: {condition: service_healthy}
      document-service: {condition: service_healthy}
      payment-service: {condition: service_healthy}
      billing-service: {condition: service_healthy}
      customer-service: {condition: service_healthy}
      contract-service: {condition: service_healthy}
      fulfillment-service: {condition: service_healthy}
      vehicle-reservation-service: {condition: service_healthy}
      inventory-service: {condition: service_healthy}
      crm-service: {condition: service_healthy}
      search-service: {condition: service_healthy}
      audit-service: {condition: service_healthy}
      analytics-service: {condition: service_healthy}
      integration-service: {condition: service_healthy}

  # Local LLM runtime. Models are persisted in the ollama-data volume.
  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    ports: ["127.0.0.1:11434:11434"]
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # Download the configured model once; the named volume is shared with Ollama.
  ollama-model-init:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull \"$OLLAMA_MODEL\""]
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    volumes:
      - ollama-data:/root/.ollama
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"

  ai-service:
    build:
      context: .
      dockerfile: docker/php/service.Dockerfile
      args:
        SERVICE_PATH: apps/ai-service
        COMPOSER_NO_DEV: ""
    ports: ["127.0.0.1:8095:8080"]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${AI_APP_SECRET:-local-only-ai-service-secret}
      DEFAULT_URI: http://localhost:8095
      AI_PROVIDER: ollama
      OLLAMA_BASE_URI: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "php", "-r", "$$context = stream_context_create(['http' => ['timeout' => 5, 'ignore_errors' => true]]); $$body = @file_get_contents('http://127.0.0.1:8080/health/ready', false, $$context); $$status = $$http_response_header[0] ?? ''; exit($$body !== false && str_contains($$status, ' 200 ') ? 0 : 1);"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 60s
    init: true
    restart: unless-stopped

  fulfillment-service:
    build:
      context: .
      dockerfile: docker/php/service.Dockerfile
      args:
        SERVICE_PATH: apps/fulfillment-service
        COMPOSER_NO_DEV: ""
    ports: ["8091:8080"]
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: local-only-fulfillment-service-secret
      FULFILLMENT_DATABASE_URL: \${FULFILLMENT_DATABASE_URL:-postgresql://autoflow_fulfillment:local-only-fulfillment-password@postgres:5432/autoflow}
      AUTOFLOW_JWT_ISSUER: \${KEYCLOAK_ISSUER:-http://localhost:8080/realms/autoflow}
      AUTOFLOW_JWT_JWKS_URI: \${KEYCLOAK_JWKS_URI:-http://keycloak:8080/realms/autoflow/protocol/openid-connect/certs}
      OTEL_SERVICE_NAME: autoflow-fulfillment-service
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=autoflow,deployment.environment=local
      OTEL_PHP_AUTOLOAD_ENABLED: "true"
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: "10000"
      OTEL_METRIC_EXPORT_TIMEOUT: "5000"
      OTEL_LOGS_EXPORTER: none
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://tempo:4318
      OTEL_EXPORTER_OTLP_METRICS_ENDPOINT: http://alloy:4318/v1/metrics
      OTEL_PROPAGATORS: tracecontext,baggage
      OTEL_PHP_EXCLUDED_URLS: ^/health
    depends_on:
      postgres: {condition: service_healthy}
      postgres-bootstrap: {condition: service_completed_successfully}
      keycloak: {condition: service_started}
      tempo: {condition: service_started}
      alloy: {condition: service_started}
    healthcheck:
      test: ["CMD", "php", "-r", "$$context = stream_context_create(['http' => ['timeout' => 5, 'ignore_errors' => true]]); $$body = @file_get_contents('http://127.0.0.1:8080/health/ready', false, $$context); $$status = $$http_response_header[0] ?? ''; exit($$body !== false && str_contains($$status, ' 200 ') ? 0 : 1);"]
