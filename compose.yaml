services:
  php:
    build: .
    container_name: autoflow-php
    working_dir: /var/www/auto-flow
    volumes:
      - ./:/var/www/auto-flow
      - composer-cache:/tmp/composer/cache
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://autoflow:autoflow@postgres:5432/autoflow?serverVersion=16&charset=utf8}
      XDEBUG_MODE: ${XDEBUG_MODE:-off}
      XDEBUG_CONFIG: client_host=host.docker.internal client_port=9003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      redis: {condition: service_healthy}
    init: true
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-autoflow}
      POSTGRES_USER: ${POSTGRES_USER:-autoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-autoflow}
    ports: ["5432:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-autoflow} -d ${POSTGRES_DB:-autoflow}"]
      interval: 5s
      timeout: 3s
      retries: 10
  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-autoflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-autoflow}
    ports: ["5672:5672","15672:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD","rabbitmq-diagnostics","-q","ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025","8025:8025"]
volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  composer-cache:
