      DOCUMENT_S3_SSE_C_KEY_BASE64: ${DOCUMENT_S3_SSE_C_KEY_BASE64:-YXV0b2Zsb3ctZG9jdW1lbnQtc3RvcmFnZS1rZXktMDE=}
