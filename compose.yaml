      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-autoflow}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-autoflow}
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"]
    ports: ["5672:5672", "15672:15672", "15692:15692"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "listeners"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports: ["9200:9200"]
    volumes: [elasticsearch-data:/usr/share/elasticsearch/data]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200 >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  kibana:
    image: docker.elastic.co/kibana/kibana:8.17.5
    environment:
      ELASTICSEARCH_HOSTS: '["http://elasticsearch:9200"]'
      SERVER_NAME: autoflow-kibana
      SERVER_PUBLICBASEURL: http://localhost:5601
    ports: ["5601:5601"]
    depends_on:
      elasticsearch: {condition: service_healthy}

  mercure:
    image: dunglas/mercure:v1.1.5
    environment:
      SERVER_NAME: ":80"
      MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:-!ChangeThisMercurePublisherKeyForLocalDevelopmentOnly!}
      MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY:-!ChangeThisMercureSubscriberKeyForLocalDevelopmentOnly!}
      MERCURE_EXTRA_DIRECTIVES: "cors_origins ${MERCURE_CORS_ORIGINS:-http://localhost:3000 http://localhost:8000}"
    ports: ["3001:80"]
    volumes:
      - mercure-data:/data
      - mercure-config:/config

  mailpit:
    image: axllent/mailpit:v1.22.3
    ports: ["1025:1025", "8025:8025"]

  prometheus:
    image: prom/prometheus:v3.1.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
      - --web.enable-remote-write-receiver
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infrastructure/observability/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - rabbitmq
      - postgres-exporter
      - redis-exporter
      - elasticsearch-exporter
      - cadvisor
      - node-exporter

  grafana:
    image: grafana/grafana:11.5.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports: ["3002:3000"]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infrastructure/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infrastructure/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./infrastructure/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yml"]
    ports: ["3100:3100"]
    volumes:
      - ./infrastructure/observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki

  alloy:
    image: grafana/alloy:v1.6.1
    command: ["run", "--stability.level=experimental", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports: ["12345:12345"]
    volumes:
      - ./infrastructure/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
      - prometheus

  tempo:
    image: grafana/tempo:2.7.2
    command: ["-config.file=/etc/tempo/tempo.yml"]
    ports: ["3200:3200", "4317:4317", "4318:4318"]
    volumes:
      - ./infrastructure/observability/tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    environment:
      DATA_SOURCE_NAME: postgresql://${POSTGRES_USER:-autoflow}:${POSTGRES_PASSWORD:-autoflow}@postgres:5432/${POSTGRES_DB:-autoflow}?sslmode=disable
    depends_on:
      postgres: {condition: service_healthy}

  redis-exporter:
    image: oliver006/redis_exporter:v1.67.0
    environment:
      REDIS_ADDR: redis://redis:6379
    depends_on:
      redis: {condition: service_healthy}

  elasticsearch-exporter:
    image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.8.0
    command: ["--es.uri=http://elasticsearch:9200"]
    depends_on:
      elasticsearch: {condition: service_healthy}

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  node-exporter:
    image: prom/node-exporter:v1.8.2
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro


  web-frontend:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-lc", "npm install --no-audit --no-fund && npm run dev"]
    ports: ["3000:3000"]
    volumes:
      - ./apps/web-frontend:/app
      - web-frontend-node-modules:/app/node_modules
    environment:
      NUXT_TELEMETRY_DISABLED: "1"
      NITRO_PORT: "3000"
      VITE_KEYCLOAK_URL: http://localhost:8080
      VITE_KEYCLOAK_REALM: autoflow
      VITE_KEYCLOAK_CLIENT_ID: autoflow-local-client
      VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY:-}
      VITE_MERCURE_HUB_URL: ${MERCURE_PUBLIC_URL:-http://localhost:3001/.well-known/mercure}
      # Nitro forwards browser service prefixes through the gateway; the gateway preserves upstream /api paths.
      CUSTOMER_PROXY_TARGET: http://api-gateway
      CATALOG_PROXY_TARGET: http://api-gateway
      OFFER_PROXY_TARGET: http://api-gateway
      PRICING_PROXY_TARGET: http://api-gateway
      ORDER_PROXY_TARGET: http://api-gateway
      PAYMENT_PROXY_TARGET: http://api-gateway
      BILLING_PROXY_TARGET: http://api-gateway
      CRM_PROXY_TARGET: http://api-gateway
      CONTRACT_PROXY_TARGET: http://api-gateway
      FULFILLMENT_PROXY_TARGET: http://api-gateway
      INVENTORY_PROXY_TARGET: http://api-gateway
      SEARCH_PROXY_TARGET: http://api-gateway
      RESERVATION_PROXY_TARGET: http://api-gateway
      AUDIT_PROXY_TARGET: http://api-gateway
      ANALYTICS_PROXY_TARGET: http://api-gateway
      CONFIGURATION_PROXY_TARGET: http://api-gateway
      DOCUMENT_PROXY_TARGET: http://api-gateway
      INTEGRATION_PROXY_TARGET: http://api-gateway
      WORKFLOW_PROXY_TARGET: http://workflow-service:8080
      AI_PROXY_TARGET: http://ai-service:8080
      MEDIA_PROXY_TARGET: http://media-service:8080
    depends_on:
      api-gateway: {condition: service_healthy}
      keycloak: {condition: service_started}
      mercure: {condition: service_started}
    init: true
    restart: unless-stopped

volumes:
  ollama-data:
  postgres-data:
  rabbitmq-data:
  redis-data:
  elasticsearch-data:
  composer-cache:
  mercure-data:
  mercure-config:
  prometheus-data:
  grafana-data:
  loki-data:
  tempo-data:
  temporal-data:
  contract-documents:
  document-data:
  document-object-data:
  clamav-data:
  web-frontend-node-modules:
