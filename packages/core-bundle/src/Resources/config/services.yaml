services:
    _defaults:
        autowire: true
        autoconfigure: true

    AutoFlow\CoreBundle\:
        resource: '../../'
        exclude:
            - '../../DependencyInjection/'
            - '../../Resources/'
            - '../../Tests/'
            - '../../Infrastructure/RoadRunner/'
            - '../../Infrastructure/Serialization/ProtobufSerializer.php'
            - '../../Transport/Grpc/Generated/'
            - '../../Transport/Grpc/PlatformHealthGrpcService.php'
            - '../../CoreBundle.php'

    AutoFlow\CoreBundle\Application\Clock\ClockInterface:
        alias: AutoFlow\CoreBundle\Infrastructure\Clock\SystemClock

    AutoFlow\CoreBundle\Application\Messaging\EventBusInterface:
        alias: AutoFlow\CoreBundle\Infrastructure\Messenger\MessengerEventBus

    AutoFlow\CoreBundle\Http\Correlation\CorrelationIdSubscriber:
        arguments:
            $headerName: '%autoflow_core.correlation_header%'

    AutoFlow\CoreBundle\Http\Client\CorrelationIdHttpClient:
        decorates: http_client
        arguments:
            $inner: '@.inner'
            $headerName: '%autoflow_core.correlation_header%'

    AutoFlow\CoreBundle\Security\JwksKeyProvider:
        arguments:
            $jwksUri: '%autoflow_core.jwt.jwks_uri%'
            $cacheTtlSeconds: '%autoflow_core.jwt.jwks_cache_ttl%'

    AutoFlow\CoreBundle\Security\JwtTokenVerifier:
        arguments:
            $issuer: '%autoflow_core.jwt.issuer%'
            $audience: '%autoflow_core.jwt.audience%'

    AutoFlow\CoreBundle\Security\JwtAuthenticationSubscriber:
        arguments:
            $enabled: '%autoflow_core.jwt.enabled%'
            $protectedPrefixes: '%autoflow_core.jwt.protected_path_prefixes%'
            $excludedPaths: '%autoflow_core.jwt.excluded_paths%'

    AutoFlow\CoreBundle\Security\TenantDelegationSubscriber:
        arguments:
            $pathPrefixes: '%autoflow_core.jwt.tenant_required_path_prefixes%'

    AutoFlow\CoreBundle\Health\HealthController:
        arguments:
            $checks: !tagged_iterator autoflow_core.health_check
