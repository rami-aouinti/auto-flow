name: Analytics and Integration Services

on:
  push:
    branches: [master]
    paths:
      - "apps/analytics-service/**"
      - "apps/integration-service/**"
      - "docker/php/business-service.Dockerfile"
      - "compose.yaml"
      - "infrastructure/keycloak/realm/autoflow-realm.json"
      - ".github/workflows/analytics-integration.yml"
  pull_request:
    paths:
      - "apps/analytics-service/**"
      - "apps/integration-service/**"
      - "docker/php/business-service.Dockerfile"
      - "compose.yaml"
      - "infrastructure/keycloak/realm/autoflow-realm.json"
      - ".github/workflows/analytics-integration.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Lint Analytics and Integration PHP
        run: |
          docker run --rm -v "$PWD:/app" -w /app php:8.4-cli sh -lc "find apps/analytics-service apps/integration-service -name '*.php' -print0 | xargs -0 -n1 php -l"
      - name: Validate analytics and integration OpenAPI
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          spec = json.loads(Path("docs/api/openapi.json").read_text())
          required = {
              "/api/v1/analytics/events": ["post"],
              "/api/v1/analytics/overview": ["get"],
              "/api/v1/analytics/series": ["get"],
              "/api/v1/analytics/export.csv": ["get"],
              "/webhooks/{provider}": ["post"],
              "/api/v1/integrations/webhook-events": ["get"],
              "/api/v1/integrations/deliveries": ["get", "post"],
              "/api/v1/integrations/providers": ["get"],
          }
          for path, methods in required.items():
              assert path in spec["paths"], f"Missing OpenAPI path: {path}"
              for method in methods:
                  assert method in spec["paths"][path], f"Missing {method.upper()} {path}"
                  assert spec["paths"][path][method].get("responses"), f"Missing responses for {method.upper()} {path}"
          print("OpenAPI JSON and Analytics/Integration contracts are valid.")
          PY
      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Build and start services
        run: |
          docker compose --env-file .env.example up -d --build \
            postgres postgres-bootstrap rabbitmq keycloak \
            analytics-service analytics-event-consumer \
            integration-service integration-delivery-worker
      - name: Wait for health endpoints
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8102/health/ready >/dev/null \
              && curl -fsS http://localhost:8099/health/ready >/dev/null; then exit 0; fi
            sleep 5
          done
          docker compose --env-file .env.example ps
          docker compose --env-file .env.example logs --no-color postgres-bootstrap analytics-service integration-service
          exit 1
      - name: Run smoke tests
        run: |
          sh apps/analytics-service/tests/smoke.sh
          sh apps/integration-service/tests/smoke.sh
      - name: Show service logs on failure
        if: failure()
        run: docker compose --env-file .env.example logs --no-color analytics-service analytics-event-consumer integration-service integration-delivery-worker
      - name: Stop services
        if: always()
        run: docker compose --env-file .env.example down -v
