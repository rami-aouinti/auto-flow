name: Fulfillment Integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  payment-contract-reservation-fulfillment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup PHP for Fulfillment unit tests
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, mbstring, dom
          coverage: none
      - name: Install Fulfillment dependencies and run unit tests
        run: |
          composer install --working-dir=apps/fulfillment-service --ignore-platform-req=ext-opentelemetry --no-interaction --prefer-dist --no-progress
          cd apps/fulfillment-service && vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: Build Fulfillment prerequisite consumer
        run: docker compose --env-file .env.example build fulfillment-event-consumer
      - name: Start Fulfillment prerequisite consumer
        run: |
          docker compose --env-file .env.example up -d fulfillment-event-consumer
          for attempt in $(seq 1 90); do
            if docker compose --env-file .env.example logs --no-color fulfillment-event-consumer 2>&1 | grep -q "Fulfillment integration event consumer started"; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs --no-color --tail=200 fulfillment-event-consumer rabbitmq postgres postgres-bootstrap
          exit 1
      - name: Verify Payment + Contract + Reservation prerequisites
        run: docker compose --env-file .env.example exec -T fulfillment-event-consumer php bin/smoke-test-prerequisites.php
      - name: Collect integration diagnostics
        if: failure()
        run: |
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs --no-color --tail=250 fulfillment-event-consumer rabbitmq postgres postgres-bootstrap
      - name: Stop test infrastructure
        if: always()
        run: docker compose --env-file .env.example down -v
