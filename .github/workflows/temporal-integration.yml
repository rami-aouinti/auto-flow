name: Temporal Integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  rabbitmq-temporal-saga:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: apps/order-workflow-worker/go.mod
      - name: Build Temporal worker
        run: docker compose --env-file .env.example build order-workflow-worker
      - name: Start RabbitMQ, Temporal and workflow worker
        run: |
          docker compose --env-file .env.example up -d temporal order-workflow-worker
          for attempt in $(seq 1 90); do
            worker_ready=0
            consumer_ready=0
            if docker compose --env-file .env.example logs --no-color order-workflow-worker 2>&1 | grep -q "Order workflow worker started"; then
              worker_ready=1
            fi
            if docker compose --env-file .env.example logs --no-color order-workflow-worker 2>&1 | grep -q "Order Saga RabbitMQ consumer started"; then
              consumer_ready=1
            fi
            if [ "$worker_ready" -eq 1 ] && [ "$consumer_ready" -eq 1 ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs --no-color --tail=200 temporal order-workflow-worker rabbitmq
          exit 1
      - name: Verify real RabbitMQ to Temporal Saga execution
        env:
          TEMPORAL_ADDRESS: 127.0.0.1:7233
          RABBITMQ_HOST: 127.0.0.1
          RABBITMQ_PORT: "5672"
          RABBITMQ_USER: autoflow
          RABBITMQ_PASSWORD: autoflow
          AUTOFLOW_TEMPORAL_RABBITMQ_E2E: "1"
        working-directory: apps/order-workflow-worker
        run: go test ./internal/orders -run '^TestLiveRabbitMQTemporalSagaStartsAndPublishesReservationHold$' -count=1 -v
      - name: Collect integration diagnostics
        if: failure()
        run: |
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs --no-color --tail=250 temporal order-workflow-worker rabbitmq
      - name: Stop test infrastructure
        if: always()
        run: docker compose --env-file .env.example down -v
