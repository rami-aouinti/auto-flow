name: Quality

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js for Vue frontend
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Build and type-check Vue frontend
        working-directory: apps/web-frontend
        run: |
          npm install --no-audit --no-fund
          npm run typecheck
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: xdebug
          extensions: pdo_pgsql, mbstring, sockets, dom
          tools: composer:v2
      - name: Setup Go for Temporal Order worker
        uses: actions/setup-go@v7
        with:
          go-version: "1.23"
          cache: true
          cache-dependency-path: apps/order-workflow-worker/go.mod
      - name: Test and build Temporal Order worker
        working-directory: apps/order-workflow-worker
        run: |
          gofmt -w ./cmd ./internal
          go mod tidy
          go test ./...
          go build ./cmd/worker
      - name: Validate Composer
        run: composer validate --strict
      - name: Validate service Composer manifests
        run: |
          composer validate --strict --working-dir=apps/offer-service
          composer validate --strict --working-dir=apps/pricing-service
          composer validate --strict --working-dir=apps/vehicle-catalog-service
          composer validate --strict --working-dir=apps/order-service
          composer validate --strict --working-dir=apps/payment-service
          composer validate --strict --working-dir=apps/notification-service
          composer validate --strict --working-dir=apps/billing-service
          composer validate --strict --working-dir=apps/customer-service
          composer validate --strict --working-dir=apps/contract-service
          composer validate --strict --working-dir=apps/fulfillment-service
          composer validate --strict --working-dir=apps/vehicle-reservation-service
          composer validate --strict --working-dir=apps/inventory-service
          composer validate --strict --working-dir=apps/crm-service
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Validate Grafana Alloy configuration
        run: |
          set +e
          timeout 10s docker run --rm \
            -v "$PWD/infrastructure/observability/alloy/config.alloy:/etc/alloy/config.alloy:ro" \
            grafana/alloy:v1.6.1 run \
            --stability.level=experimental \
            --server.http.listen-addr=0.0.0.0:12345 \
            /etc/alloy/config.alloy
          status=$?
          if [ "$status" -eq 124 ]; then
            exit 0
          fi
          exit "$status"
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Install CRM Service dependencies and run unit tests
        run: |
          composer install --working-dir=apps/crm-service --no-interaction --prefer-dist --no-progress
          cd apps/crm-service
          vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: Install Contract Service dependencies and run signature tests
        run: |
          composer install --working-dir=apps/contract-service --no-interaction --prefer-dist --no-progress
          cd apps/contract-service
          vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: Install Billing Service dependencies and run legal snapshot tests
        run: |
          composer install --working-dir=apps/billing-service --no-interaction --prefer-dist --no-progress
          cd apps/billing-service
          vendor/bin/phpunit --configuration phpunit.xml.dist
          php -l bin/consume-payment-events.php
          php -l src/Application/InvoiceLegalSnapshot.php
      - name: Install Offer Service dependencies for integration tests
        run: |
          composer install \
            --working-dir=apps/offer-service \
            --ignore-platform-req=ext-opentelemetry \
            --no-interaction --prefer-dist --no-progress
      - name: Run Offer unit tests
        run: vendor/bin/phpunit --configuration phpunit.xml tests/Unit/Offer
      - name: Start PostgreSQL and apply all database migrations
        run: |
          docker compose --env-file .env.example up -d postgres rabbitmq
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -h 127.0.0.1 -p 5432 -U autoflow -d autoflow; then
              break
            fi
            sleep 2
          done
          if ! docker compose exec -T postgres pg_isready -h 127.0.0.1 -p 5432 -U autoflow -d autoflow; then
            docker compose ps -a
            docker compose logs postgres
            exit 1
          fi
          docker compose --env-file .env.example run --rm postgres-bootstrap
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT to_regclass('public.offer_outbox_events') IS NOT NULL AS outbox_ready"
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT to_regclass('public.orders') IS NOT NULL AS orders_ready"
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT to_regclass('public.order_transition_idempotency') IS NOT NULL AS transition_idempotency_ready"
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT to_regclass('public.order_payment_event_inbox') IS NOT NULL AS order_payment_inbox_ready"
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'order_payment_event_inbox' AND column_name = 'payload_hash') AS order_payment_inbox_fingerprint_ready"
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'payments' AND column_name = 'billing_snapshot') AS payment_billing_snapshot_ready"
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'billing_credit_notes' AND column_name = 'billing_snapshot') AS credit_note_billing_snapshot_ready"
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'orders' AND column_name = 'payment_status') AS order_payment_status_ready"
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT EXISTS (SELECT 1 FROM information_schema.columns WHERE table_name = 'orders' AND column_name = 'customer_snapshot') AS order_customer_snapshot_ready"
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT to_regclass('public.contract_records') IS NOT NULL AS contract_records_ready"
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT to_regclass('public.contract_outbox') IS NOT NULL AS contract_outbox_ready"
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT to_regclass('public.payments') IS NOT NULL AS payments_ready"
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT to_regclass('public.fulfillment_records') IS NOT NULL AS fulfillment_records_ready"
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT to_regclass('public.fulfillment_event_inbox') IS NOT NULL AS fulfillment_inbox_ready"
          docker compose exec -T rabbitmq rabbitmqctl await_startup --timeout 60
          docker compose exec -T rabbitmq rabbitmq-diagnostics listeners
          docker compose exec -T rabbitmq rabbitmqctl list_users
          timeout 2 bash -c '</dev/tcp/127.0.0.1/5672'
      - name: Run Offer PostgreSQL and RabbitMQ integration tests
        env:
          OFFER_TEST_DATABASE_URL: postgresql://autoflow_offer:local-only-offer-password@127.0.0.1:5432/autoflow
          RABBITMQ_TEST_HOST: 127.0.0.1
          RABBITMQ_TEST_PORT: 5672
          RABBITMQ_TEST_USER: autoflow
          RABBITMQ_TEST_PASSWORD: autoflow
        run: vendor/bin/phpunit --configuration phpunit.xml tests/Integration/Offer
      - name: Collect RabbitMQ diagnostics on failure
        if: failure()
        run: |
          docker compose logs rabbitmq
          docker compose exec -T rabbitmq rabbitmq-diagnostics listeners || true
          docker compose exec -T rabbitmq rabbitmqctl list_users || true
      - name: Install Order Service dependencies and run domain tests
        run: |
          composer install --working-dir=apps/order-service --ignore-platform-req=ext-opentelemetry --no-interaction --prefer-dist --no-progress
          cd apps/order-service && vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: Lint Order Payment event consumer
        run: php -l apps/order-service/bin/consume-payment-events.php
      - name: Run Order PostgreSQL integration tests
        env:
          ORDER_TEST_DATABASE_URL: postgresql://autoflow_order:local-only-order-password@127.0.0.1:5432/autoflow
        run: |
          cd apps/order-service
          vendor/bin/phpunit --configuration phpunit.xml.dist tests/Integration/Order
      - name: Install Payment Service dependencies and run unit tests
        run: |
          composer install --working-dir=apps/payment-service --ignore-platform-req=ext-opentelemetry --no-interaction --prefer-dist --no-progress
          cd apps/payment-service && vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: Install Fulfillment Service dependencies and run unit tests
        run: |
          composer install --working-dir=apps/fulfillment-service --ignore-platform-req=ext-opentelemetry --no-interaction --prefer-dist --no-progress
          cd apps/fulfillment-service && vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: Install Inventory Service dependencies and run unit tests
        run: |
          composer install --working-dir=apps/inventory-service --ignore-platform-req=ext-opentelemetry --no-interaction --prefer-dist --no-progress
          cd apps/inventory-service && vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: Install Vehicle Reservation Service dependencies and run unit/integration tests
        env:
          RESERVATION_TEST_DATABASE_URL: postgresql://autoflow_reservation:local-only-reservation-password@127.0.0.1:5432/autoflow
          RESERVATION_WORKER_TEST_DATABASE_URL: postgresql://autoflow_reservation_worker:local-only-reservation-worker-password@127.0.0.1:5432/autoflow
          RESERVATION_PUBLISHER_TEST_DATABASE_URL: postgresql://autoflow_reservation_publisher:local-only-reservation-publisher-password@127.0.0.1:5432/autoflow
        run: |
          composer install --working-dir=apps/vehicle-reservation-service --no-interaction --prefer-dist --no-progress
          cd apps/vehicle-reservation-service && vendor/bin/phpunit --configuration phpunit.xml.dist
          php -l bin/consume-saga-commands.php
          find src -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run Vehicle Reservation expiry and RabbitMQ end-to-end test
        run: |
          docker compose --env-file .env.example up -d vehicle-reservation-service reservation-expiry-worker reservation-outbox-publisher reservation-saga-command-consumer reservation-inventory-event-consumer inventory-service inventory-outbox-publisher inventory-reservation-event-consumer crm-service crm-outbox-publisher
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8092/health/ready >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "Vehicle Reservation readiness failed; dumping service and database bootstrap logs."
            docker compose --env-file .env.example logs --no-color --tail=200 vehicle-reservation-service postgres-bootstrap postgres
            echo "Liveness response:"
            curl -sS -i http://127.0.0.1:8092/health/live || true
            echo "Readiness response:"
            curl -sS -i http://127.0.0.1:8092/health/ready || true
            exit 1
          fi
          curl -fsS http://127.0.0.1:8092/health/ready
          for attempt in $(seq 1 30); do
            if docker compose --env-file .env.example logs reservation-inventory-event-consumer 2>&1 | grep -q "consumer started"; then
              break
            fi
            sleep 1
          done
          docker compose --env-file .env.example logs reservation-inventory-event-consumer 2>&1 | grep -q "consumer started"
          docker compose --env-file .env.example exec -T vehicle-reservation-service php bin/smoke-test-inventory-events.php
          for attempt in $(seq 1 30); do
            if docker compose --env-file .env.example logs inventory-reservation-event-consumer 2>&1 | grep -q "consumer started"; then
              break
            fi
            sleep 1
          done
          docker compose --env-file .env.example logs inventory-reservation-event-consumer 2>&1 | grep -q "consumer started"
          docker compose --env-file .env.example exec -T inventory-service php bin/smoke-test-reservation-fulfillment.php
          docker compose --env-file .env.example exec -T vehicle-reservation-service php bin/smoke-test-rabbitmq.php

      - name: Install Customer Service dependencies and run unit tests
        run: |
          composer install --working-dir=apps/customer-service --ignore-platform-req=ext-opentelemetry --no-interaction --prefer-dist --no-progress
          cd apps/customer-service && vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: Install CRM Service dependencies and run tests
        env:
          CRM_TEST_DATABASE_URL: postgresql://autoflow_crm:local-only-crm-password@127.0.0.1:5432/autoflow
        run: |
          composer install --working-dir=apps/crm-service --ignore-platform-req=ext-opentelemetry --no-interaction --prefer-dist --no-progress
          php -l apps/crm-service/src/Presentation/Http/Controller/CrmController.php
          php -l apps/crm-service/bin/publish-outbox.php
          cd apps/crm-service && vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: Build instrumented Symfony services
        run: docker compose --env-file .env.example build php offer-service offer-workers pricing-service vehicle-catalog-service vehicle-catalog-outbox-publisher order-service order-outbox-publisher order-payment-event-consumer order-workflow-worker payment-service payment-outbox-publisher notification-service billing-service billing-payment-event-consumer customer-service contract-service contract-outbox-publisher fulfillment-service fulfillment-event-consumer fulfillment-outbox-publisher vehicle-reservation-service reservation-expiry-worker reservation-outbox-publisher reservation-saga-command-consumer reservation-inventory-event-consumer inventory-service inventory-outbox-publisher inventory-reservation-event-consumer
      - name: Validate development OpenAPI generation
        run: |
          docker compose --env-file .env.example run --rm --no-deps -e APP_ENV=dev offer-service php bin/console nelmio:apidoc:dump --format=json > /tmp/offer-openapi.json
          docker compose --env-file .env.example run --rm --no-deps -e APP_ENV=dev pricing-service php bin/console nelmio:apidoc:dump --format=json > /tmp/pricing-openapi.json
          php -r '
          $offer = json_decode(file_get_contents("/tmp/offer-openapi.json"), true, flags: JSON_THROW_ON_ERROR);
          $pricing = json_decode(file_get_contents("/tmp/pricing-openapi.json"), true, flags: JSON_THROW_ON_ERROR);
          $offerPaths = $offer["paths"] ?? [];
          $pricingPaths = $pricing["paths"] ?? [];
          $requiredPaths = [
              isset($offerPaths["/api/offers/{vehicleId}"]["post"]),
              isset($offerPaths["/api/offers/{offerId}"]["get"]),
              isset($offerPaths["/api/offers/{offerId}/publish"]["post"]),
              isset($offerPaths["/api/offers/{offerId}/accept"]["post"]),
              isset($offerPaths["/api/offers/{offerId}/reject"]["post"]),
              isset($pricingPaths["/api/pricing/quotes"]["post"]),
              isset($pricingPaths["/api/pricing/quotes"]["get"]),
              isset($pricingPaths["/api/pricing/quotes/{quoteId}"]["get"]),
              isset($pricingPaths["/api/pricing/quotes/{quoteId}"]["delete"]),
              isset($pricingPaths["/ready"]["get"]),
          ];
          $bearer = $pricing["components"]["securitySchemes"]["bearerAuth"] ?? null;
          $quoteSchema = $pricing["components"]["schemas"]["PricingQuote"] ?? null;
          $postSchema = $pricingPaths["/api/pricing/quotes"]["post"]["requestBody"]["content"]["application/json"]["schema"]["\$ref"] ?? null;
          $healthSecurity = $pricingPaths["/health"]["get"]["security"] ?? null;
          $readySecurity = $pricingPaths["/ready"]["get"]["security"] ?? null;
          if (in_array(false, $requiredPaths, true)
              || ($bearer["scheme"] ?? null) !== "bearer"
              || ($bearer["type"] ?? null) !== "http"
              || !is_array($quoteSchema)
              || $postSchema !== "#/components/schemas/PricingQuoteRequest"
              || $healthSecurity !== []
              || $readySecurity !== []) {
              fwrite(STDERR, "Generated OpenAPI is missing required Offer/Pricing operations, Pricing schemas, JWT bearer auth, or public health/readiness definitions.\n");
              exit(1);
          }
          '
      - name: Apply Vehicle Catalog Doctrine migrations and validate mappings
        run: |
          docker compose --env-file .env.example run --rm --no-deps \
            -e DATABASE_URL=postgresql://autoflow:autoflow@postgres:5432/autoflow \
            vehicle-catalog-service php bin/console doctrine:migrations:migrate --no-interaction
          docker compose --env-file .env.example run --rm --no-deps vehicle-catalog-service \
            php bin/console doctrine:schema:validate --skip-sync
      - name: Run Vehicle Catalog unit and PostgreSQL integration tests
        run: |
          docker compose --env-file .env.example run --rm --no-deps \
            -e CATALOG_TEST_DATABASE_URL=postgresql://autoflow_catalog:local-only-catalog-password@postgres:5432/autoflow \
            vehicle-catalog-service php vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: Validate Vehicle Catalog OpenAPI contract
        run: |
          docker compose --env-file .env.example run --rm --no-deps -e APP_ENV=dev vehicle-catalog-service \
            php bin/console nelmio:apidoc:dump --format=json > /tmp/catalog-openapi.json
          php -r '
          $api = json_decode(file_get_contents("/tmp/catalog-openapi.json"), true, flags: JSON_THROW_ON_ERROR);
          $paths = $api["paths"] ?? [];
          $required = [
              isset($paths["/api/v1/manufacturers"]["get"]),
              isset($paths["/api/v1/vehicles"]["get"]),
              isset($paths["/api/v1/vehicles/{variantId}"]["get"]),
              isset($paths["/api/v1/manufacturers"]["post"]),
              isset($paths["/api/v1/models"]["post"]),
              isset($paths["/api/v1/generations"]["post"]),
              isset($paths["/api/v1/vehicles"]["post"]),
              isset($paths["/api/v1/vehicles/{variantId}/publish"]["post"]),
              isset($api["components"]["schemas"]["VehicleResponse"]),
              isset($api["components"]["schemas"]["ManufacturerResponse"]),
          ];
          $bearer = $api["components"]["securitySchemes"]["bearerAuth"] ?? null;
          if (in_array(false, $required, true) || ($bearer["scheme"] ?? null) !== "bearer") {
              fwrite(STDERR, "Vehicle Catalog OpenAPI contract is missing required operations, response schemas or bearer authentication.\\n");
              exit(1);
          }
          '
      - name: Install Vehicle Catalog dependencies for static analysis
        run: |
          composer install \
            --working-dir=apps/vehicle-catalog-service \
            --ignore-platform-req=ext-opentelemetry \
            --no-interaction --prefer-dist --no-progress
      - name: Install Notification Service dependencies for static analysis
        run: |
          composer install \
            --working-dir=apps/notification-service \
            --no-interaction --prefer-dist --no-progress
      - name: Install Billing Service dependencies and run unit tests
        run: |
          composer install \
            --working-dir=apps/billing-service \
            --ignore-platform-req=ext-opentelemetry \
            --no-interaction --prefer-dist --no-progress
          php -l apps/billing-service/bin/consume-payment-events.php
          cd apps/billing-service && vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: Install Contract Service dependencies and lint API
        run: |
          composer install --working-dir=apps/contract-service --ignore-platform-req=ext-opentelemetry --no-interaction --prefer-dist --no-progress
          php -l apps/contract-service/src/Presentation/Http/Controller/ContractController.php
          php -l apps/contract-service/src/Infrastructure/Health/ContractDatabaseHealthCheck.php
          php -l apps/contract-service/bin/publish-outbox.php
          php -l apps/contract-service/src/Infrastructure/Document/ContractDocumentManager.php
          php -l apps/contract-service/src/Infrastructure/Signature/DocuSignSignatureProvider.php
          php -l apps/contract-service/src/Application/Port/SignatureProviderInterface.php
          php -l apps/contract-service/src/Presentation/Http/Controller/DocuSignWebhookController.php
          cd apps/contract-service && vendor/bin/phpunit --configuration phpunit.xml.dist
      - name: Run PHPStan analysis
        run: composer phpstan
      - name: Run quality checks
        run: composer quality
