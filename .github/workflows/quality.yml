name: Quality

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: xdebug
          tools: composer:v2
      - name: Validate Composer
        run: composer validate --strict
      - name: Validate service Composer manifests
        run: |
          composer validate --strict --working-dir=apps/offer-service
          composer validate --strict --working-dir=apps/pricing-service
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run quality checks
        run: composer quality
      - name: Build instrumented Symfony services
        run: docker compose --env-file .env.example build offer-service pricing-service
