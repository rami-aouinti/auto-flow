name: Quality

on:
  push:
    branches: [master, "feature/**"]
  pull_request:
    branches: [master]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: xdebug
          tools: composer:v2
      - name: Validate Composer
        run: composer validate --strict
      - name: Validate service Composer manifests
        run: |
          composer validate --strict --working-dir=apps/offer-service
          composer validate --strict --working-dir=apps/pricing-service
      - name: Validate Docker Compose configuration
        run: docker compose --env-file .env.example config --quiet
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Run quality checks
        run: composer quality
      - name: Start PostgreSQL and apply Offer migrations
        run: |
          docker compose --env-file .env.example up -d postgres
          for attempt in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U autoflow -d autoflow; then
              break
            fi
            sleep 2
          done
          docker compose exec -T postgres psql -U autoflow -d autoflow -c "SELECT to_regclass('public.offer_outbox_events') IS NOT NULL AS outbox_ready"
      - name: Run Offer PostgreSQL integration tests
        env:
          OFFER_TEST_DATABASE_URL: postgresql://autoflow_offer:local-only-offer-password@127.0.0.1:5432/autoflow
        run: vendor/bin/phpunit --configuration phpunit.xml tests/Integration/Offer
      - name: Build instrumented Symfony services
        run: docker compose --env-file .env.example build php offer-service offer-expiration-worker offer-outbox-publisher pricing-service
      - name: Validate development OpenAPI generation
        run: |
          docker compose --env-file .env.example run --rm --no-deps offer-service php bin/console nelmio:apidoc:dump --format=json > /tmp/offer-openapi.json
          docker compose --env-file .env.example run --rm --no-deps pricing-service php bin/console nelmio:apidoc:dump --format=json > /tmp/pricing-openapi.json
          php -r '$offer = json_decode(file_get_contents("/tmp/offer-openapi.json"), true, flags: JSON_THROW_ON_ERROR); $pricing = json_decode(file_get_contents("/tmp/pricing-openapi.json"), true, flags: JSON_THROW_ON_ERROR); if (!isset($offer["paths"]["/api/offers/{vehicleId}"]["get"]) || !isset($pricing["paths"]["/api/pricing/quotes"]["post"])) { fwrite(STDERR, "Expected REST paths are missing from the generated OpenAPI documents.\n"); exit(1); }'
