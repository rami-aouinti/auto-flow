name: Billing Integration

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  payment-billing-rabbitmq:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Build Billing API and Payment consumer
        run: docker compose --env-file .env.example build billing-service billing-payment-event-consumer
      - name: Start Billing API and Payment event consumer
        run: |
          docker compose --env-file .env.example up -d billing-service billing-payment-event-consumer
          for attempt in $(seq 1 90); do
            if docker compose --env-file .env.example logs --no-color billing-payment-event-consumer 2>&1 | grep -q "Billing Payment event consumer started"; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs --no-color --tail=200 billing-service billing-payment-event-consumer rabbitmq postgres postgres-bootstrap
          exit 1
      - name: Verify invoice, credit note, replay and dead-letter behavior
        run: docker compose --env-file .env.example exec -T billing-service php bin/smoke-test-payment-events.php
      - name: Collect integration diagnostics
        if: failure()
        run: |
          docker compose --env-file .env.example ps -a
          docker compose --env-file .env.example logs --no-color --tail=250 billing-service billing-payment-event-consumer rabbitmq postgres postgres-bootstrap
      - name: Stop test infrastructure
        if: always()
        run: docker compose --env-file .env.example down -v
