name: Pricing Service

on:
  pull_request:
    paths:
      - "apps/pricing-service/**"
      - "docker/php/service.Dockerfile"
      - ".github/workflows/pricing-service.yml"
  push:
    branches:
      - master
    paths:
      - "apps/pricing-service/**"
      - "docker/php/service.Dockerfile"
      - ".github/workflows/pricing-service.yml"

permissions:
  contents: read

jobs:
  unit-tests:
    name: Pricing domain unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build test image
        run: |
          docker build \
            --file docker/php/service.Dockerfile \
            --build-arg SERVICE_PATH=apps/pricing-service \
            --build-arg COMPOSER_NO_DEV= \
            --tag autoflow-pricing-test .

      - name: Run PHPUnit
        run: docker run --rm --entrypoint vendor/bin/phpunit autoflow-pricing-test
